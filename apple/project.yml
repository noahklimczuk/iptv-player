# The Apple app's Xcode project, as text. Generate it with:
#
#   apple/scripts/generate-project.sh
#
# The .xcodeproj is git-ignored: this file is the source of truth, so a project change
# is a reviewable diff of a few lines rather than of project.pbxproj.
name: Aurora
options:
  bundleIdPrefix: io.github.noahklimczuk.aurora
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # The version people see on the App Store, the same on every device (universal
    # purchase). The build number rises with every upload: testflight.sh sets it.
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # One App Store listing for iPhone, iPad and Apple TV, bought once (universal
    # purchase): both apps share this identifier, and the Top Shelf hangs off it.
    AURORA_BUNDLE_ID: io.github.noahklimczuk.aurora
    # Signing for a real device: set your team in Xcode, or DEVELOPMENT_TEAM here
    # locally. Simulators need none.
    CODE_SIGN_STYLE: Automatic

packages:
  # libmpv for iOS and tvOS. The plain `MPVKit` product is the LGPL build of mpv and
  # FFmpeg; `MPVKit-GPL` is not used (docs/APPLE_PORT_AND_SYNC.md §2.6).
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.1.0-n9.0.2

targetTemplates:
  AuroraApp:
    type: application
    sources:
      - path: Shared
        excludes: [Privacy/PrivacyInfo.xcprivacy]
      # The licence notices, shown in Settings → About and obliged to travel with the
      # app (libmpv and FFmpeg are LGPL): the Apple build's own, then the shared file.
      - path: THIRD-PARTY-NOTICES-APPLE.md
        buildPhase: resources
      - path: ../THIRD-PARTY-NOTICES.md
        buildPhase: resources
      # The privacy manifest App Store Connect checks every upload for.
      - path: Shared/Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - framework: Frameworks/AuroraCore.xcframework
        embed: false
      - package: MPVKit
        product: MPVKit
    preBuildScripts:
      - name: Check the Rust core is built
        script: |
          if [ ! -d "$SRCROOT/Frameworks/AuroraCore.xcframework" ] || [ ! -f "$SRCROOT/Shared/Core/Generated/aurora_ffi.swift" ]; then
            echo "error: run apple/scripts/build-core.sh first (the Rust core and its Swift bindings are built from source, not committed)"
            exit 1
          fi
        basedOnDependencyAnalysis: false

targets:
  AuroraTV:
    templates: [AuroraApp]
    info:
      path: AuroraTV/Info.plist
      properties:
        # From MARKETING_VERSION and CURRENT_PROJECT_VERSION above, so an upload's
        # build number is the one testflight.sh passes (a fixed "1" here would clash).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Standard, published algorithms only (TLS, the sync vault's XChaCha20-Poly1305
        # and Argon2id, pairing's X25519 + ChaCha20-Poly1305), used to protect the
        # viewer's own data and sign-ins: exempt (AppStore/EXPORT_COMPLIANCE.md).
        ITSAppUsesNonExemptEncryption: false
        # Poster and logo artwork loads through URLSession (AsyncImage), and providers
        # serve it from arbitrary hosts, mostly over plain http://. The Rust core and
        # mpv open their own sockets and are not subject to App Transport Security.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # `aurora://title/movie/12`: the Top Shelf's way into a title's page.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.noahklimczuk.aurora.title
            CFBundleURLSchemes: [aurora]
        # Pairing with a phone over the home network (Shared/Core/Pairing.swift).
        NSLocalNetworkUsageDescription: Aurora looks for your iPhone on this network so it can sign this Apple TV in to sync.
        NSBonjourServices: [_aurora-pair._tcp]
        # Windows' typefaces (Shared/Fonts, from scripts/make-fonts.swift).
        UIAppFonts: [Manrope.ttf, BricolageGrotesque.ttf]
    platform: tvOS
    sources:
      - path: AuroraTV
    dependencies:
      - target: AuroraTopShelf
    entitlements:
      path: AuroraTV/AuroraTV.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.noahklimczuk.aurora]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AURORA_BUNDLE_ID)
        # The layered icon and shelf images (AuroraTV/Assets.xcassets, from
        # scripts/make-icons.swift).
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        INFOPLIST_KEY_CFBundleDisplayName: Aurora
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  AuroraMobile:
    templates: [AuroraApp]
    info:
      path: AuroraMobile/Info.plist
      properties:
        # From MARKETING_VERSION and CURRENT_PROJECT_VERSION above, so an upload's
        # build number is the one testflight.sh passes (a fixed "1" here would clash).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Standard, published algorithms only (TLS, the sync vault's XChaCha20-Poly1305
        # and Argon2id, pairing's X25519 + ChaCha20-Poly1305), used to protect the
        # viewer's own data and sign-ins: exempt (AppStore/EXPORT_COMPLIANCE.md).
        ITSAppUsesNonExemptEncryption: false
        # Poster and logo artwork loads through URLSession (AsyncImage), and providers
        # serve it from arbitrary hosts, mostly over plain http://. The Rust core and
        # mpv open their own sockets and are not subject to App Transport Security.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Finding an Apple TV to set up (Shared/Core/Pairing.swift).
        NSLocalNetworkUsageDescription: Aurora looks for Apple TVs on this network so you can sign them in to sync from here.
        NSBonjourServices: [_aurora-pair._tcp]
        # Windows' typefaces (Shared/Fonts, from scripts/make-fonts.swift).
        UIAppFonts: [Manrope.ttf, BricolageGrotesque.ttf]
    platform: iOS
    sources:
      - path: AuroraMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AURORA_BUNDLE_ID)
        # AuroraMobile/Assets.xcassets, from scripts/make-icons.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Aurora
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPad turns every way, which Split View and Slide Over also need.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  # The Apple TV's Top Shelf: Continue Watching, from a snapshot the app writes to the
  # app group (Shared/Core/TopShelf.swift). Not on iOS, which has no Top Shelf.
  AuroraTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: AuroraTopShelf
      - path: Shared/Core/TopShelf.swift
      - path: Shared/Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: AuroraTopShelf/AuroraTopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.noahklimczuk.aurora]
    info:
      path: AuroraTopShelf/Info.plist
      properties:
        # From MARKETING_VERSION and CURRENT_PROJECT_VERSION above, so an upload's
        # build number is the one testflight.sh passes (a fixed "1" here would clash).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Aurora
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AURORA_BUNDLE_ID).topshelf
        GENERATE_INFOPLIST_FILE: YES
