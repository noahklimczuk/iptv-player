[package]
name = "uniffi-bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Generates the Swift bindings for aurora-ffi. Same uniffi version as the library, by construction."

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
