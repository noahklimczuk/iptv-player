name: CI

# A pull request gets the checks that can fail fast: formatting, clippy, the type
# checks, the tests, and a `cargo check` on Windows for the `#[cfg(windows)]` code that
# a Linux runner cannot see at all. Nothing links and nothing is bundled, so a PR costs
# about three and a half minutes of wall clock.
#
# A merge builds the thing: link against libmpv, bundle the installer, publish it as
# its own release. That is the only place the nine-minute job runs now. It used to run
# on every push to every branch — twice over while a PR was open, since `push` and
# `pull_request` both fired.
#
# What this trades away, stated plainly: `cargo check` proves the Windows code
# compiles, not that it links, and linking against libmpv is where the awkward parts
# live. A break there now surfaces on main instead of on the PR. A red merge leaves the
# previous release in place, so the cost is a stale installer rather than a broken one.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that is platform-independent. Runs on Linux because it is fast and
  # because aurora-core / aurora-db / aurora-player deliberately have no platform
  # dependencies (docs/DECISIONS.md D2, D3).
  core:
    name: Core tests + UI
    runs-on: ubuntu-latest
    # PR-only. This is the bulk of "does it compile and does it work"; a merge commit's
    # contents have already been through it on the PR head.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Tauri's Linux dependencies
        # Lets this job compile aurora-app too, so a type error in the host crate is
        # caught here in seconds instead of only on the slower Windows runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-native

      # Before anything cargo, deliberately. In production mode
      # `tauri::generate_context!` embeds the frontend at compile time and panics if
      # `frontendDist` is missing, so aurora-app does not compile without a built UI.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build UI
        run: pnpm exec vite build

      - name: Rust formatting
        working-directory: src-native
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-native
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-native
        run: cargo test --workspace

      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: UI unit tests
        # `pnpm test` answered "No test files found, exiting with code 1" until there
        # were some, which is why nothing ran it.
        run: pnpm test

      - name: Rust advisories
        # The JavaScript side has had `pnpm audit` run against it; the Rust side had
        # never been checked at all. `Cargo.lock` is committed, so this is a question
        # with a definite answer rather than a moving target.
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: JavaScript advisories
        # Fails the job on a high or critical only: a moderate in a dev-only tool is
        # worth knowing about and not worth blocking a pull request over.
        run: pnpm audit --audit-level high

      - name: Release tooling
        # The version arithmetic decides what every build is called, and it is wrong in
        # ways nothing else would notice — a lexicographic compare, or reading the word
        # "feature" in prose as a feature commit.
        run: node --test scripts/version.test.mjs

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end journeys
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

  # The Windows-only half: the mpv/Win32 compositing layer and the Tauri host.
  # This is the only runner that can compile aurora-app, so a green core job alone
  # does NOT mean the app builds.
  windows:
    name: Windows checks
    runs-on: windows-latest
    # PR-only, and the reason a PR needs a Windows runner at all: the mpv/Win32 backend
    # is behind `#[cfg(windows)]`, so the Linux job above does not compile a line of it.
    # Without this, a syntax or type error in that code would reach main unchallenged.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-native

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Build UI (Tauri bundles this as frontendDist)
        run: pnpm exec vite build

      - name: Type-check every Windows-only crate
        # `cargo check` does not link, so this verifies the mpv/Win32 backend and the
        # Tauri host compile without needing libmpv's import library on the runner.
        working-directory: src-native
        run: cargo check --workspace --all-targets

      - name: Tests (crates that link nothing external)
        # aurora-player's test binary links against mpv.lib, which is not on the
        # runner, so its tests run on Linux only (they cover the platform-independent
        # NullBackend). Everything here still type-checks above.
        #
        # aurora-core and aurora-ingest matter here specifically: `fsname` exists
        # because Windows rejects filenames Linux accepts, and only a Windows
        # filesystem can prove a mangled recording name is actually creatable.
        working-directory: src-native
        run: cargo test -p aurora-core -p aurora-db -p aurora-ingest

  # The half nothing else covers: actually linking against libmpv and producing
  # something a person can run. `cargo check` on the job above proves the Windows code
  # compiles; it does not prove it links, and it produces no artifact. README §23 items
  # 1, 3, 4, 5, 12 and 17 are all unanswerable until this job hands someone a binary.
  #
  # libmpv is fetched here rather than vendored: the SDK is ~30 MB of binaries that
  # would otherwise live in git forever, and the archive is only needed at build time.
  windows-app:
    name: Windows app (portable + installer)
    runs-on: windows-latest
    # Merge-only. This job exists to produce a release asset, which is only meaningful
    # for a commit that is actually on main. The ref test is belt and braces: `push` is
    # already limited to main above, and this keeps it true if that ever widens.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      # To publish the installer to Releases at the end of the job.
      contents: write
    env:
      # `[profile.release]` is set for shipping — fat LTO and codegen-units = 1 — which
      # is the slowest possible way to build and cost 8½ minutes of mostly
      # single-threaded linking. These override it for CI only, so the committed
      # profile stays right for a real release. opt-level stays at 3: this build exists
      # to be run and judged, and the difference LTO makes to that is not worth the
      # minutes.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # Baked into the binary by `option_env!` so nobody has to paste a key into the app
      # (docs/DECISIONS.md D19). Optional: with the secret unset this is an empty string,
      # the build treats that as no key, and the app asks for one exactly as before.
      #
      # The key is not in git, but it *is* in the shipped exe and `strings` will find it.
      # That is inherent to shipping with a key; TMDB keys are free and revocable, so
      # rotating means changing the secret and merging anything.
      AURORA_TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is derived from the commits since the last release tag, and a
          # depth-1 clone cannot answer `git log v0.1.0..HEAD` at all. Without this the
          # range comes back empty and every build would quietly be a patch.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-native
          # The bundle's own key, so it does not evict the check job's cache.
          key: windows-app
          # Without this a failed run saves nothing, so every build after a red one
          # starts from zero — which is why none of these has ever been warm.
          cache-on-failure: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fetch libmpv and build its MSVC import library
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          # shinchiro's mpv-winbuild-cmake is where the official Windows libmpv builds
          # are published. The asset name carries a build date, so it is discovered
          # rather than hardcoded — and a miss fails loudly with what was on offer.
          $headers = @{ 'User-Agent' = 'aurora-ci' }
          if ($env:GITHUB_TOKEN) { $headers['Authorization'] = "Bearer $env:GITHUB_TOKEN" }
          $release = Invoke-RestMethod -Headers $headers -Uri `
            'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest'

          # `-v3-` builds require AVX2; the plain x86_64 one runs anywhere.
          $asset = $release.assets |
            Where-Object { $_.name -match '^mpv-dev-x86_64-\d' } |
            Select-Object -First 1
          if (-not $asset) {
            Write-Host "Assets published in $($release.tag_name):"
            $release.assets | ForEach-Object { Write-Host "  $($_.name)" }
            throw 'No mpv-dev-x86_64 archive in the latest release of mpv-winbuild-cmake.'
          }
          Write-Host "Using $($asset.name) from $($release.tag_name)"

          $mpv = Join-Path $env:GITHUB_WORKSPACE 'third-party\mpv'
          New-Item -ItemType Directory -Force -Path $mpv | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          & 7z x $archive "-o$mpv" -y | Out-Null

          $dll = Get-ChildItem $mpv -Recurse -Filter '*mpv*.dll' | Select-Object -First 1
          if (-not $dll) {
            Get-ChildItem $mpv -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw 'The libmpv archive contained no DLL.'
          }
          Write-Host "Runtime library: $($dll.Name)"

          # libmpv2-sys emits `cargo:rustc-link-lib=mpv`, so the MSVC linker needs an
          # mpv.lib. The archive ships only a GNU-style .dll.a, which link.exe cannot
          # read, and no .def — so the import library is built from the DLL's own
          # export table. /name: must match the DLL that is loaded at runtime.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'

          Push-Location $mpv
          $def = Join-Path $mpv 'mpv.def'
          # dumpbin's export table is four columns — ordinal, hint, RVA, name — and
          # nothing else in its output has that shape.
          $names = & dumpbin /exports $dll.FullName |
            Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if (-not $names -or $names.Count -lt 10) {
            & dumpbin /exports $dll.FullName | Select-Object -First 40
            throw "Only $($names.Count) exports found in $($dll.Name); expected libmpv's full API."
          }
          Write-Host "Generating an import library from $($names.Count) exports"
          @('EXPORTS') + $names | Out-File $def -Encoding ascii

          & lib /def:$def /name:$($dll.Name) /out:mpv.lib /MACHINE:X64
          if ($LASTEXITCODE -ne 0) { throw "lib.exe failed with $LASTEXITCODE" }
          Pop-Location

          "AURORA_MPV_DIR=$mpv"          | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "AURORA_MPV_DLL=$($dll.FullName)" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          # Explicit search path for the linker, rather than relying on how rustc
          # happens to compose LIB from its own MSVC detection.
          "RUSTFLAGS=-L native=$mpv"     | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Work out this build's version
        # Before anything compiles: `env!("CARGO_PKG_VERSION")` is how the running app
        # knows what it is, so the number has to be in the manifest at compile time or
        # the binary and its release disagree. Nothing is committed — the manifests hold
        # the last released version in git, and the build stamps the next one on top.
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/version.mjs apply)"
          echo "AURORA_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building $version"

      - name: Build the UI
        run: pnpm exec vite build

      - name: Link the app against libmpv
        # The step this whole job exists for. Everything before it is setup; if this
        # passes, the Windows code links for the first time.
        working-directory: src-native
        run: cargo build --release -p aurora-app

      - name: Assemble the portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable\Aurora TV'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'src-native\target\release\aurora-app.exe' $out
          Copy-Item $env:AURORA_MPV_DLL $out
          # The licence notices travel with the binary, not with the repository: the
          # bundled libmpv is LGPL (or GPL) and carries FFmpeg, and both require their
          # terms to reach whoever is holding the executable. Settings -> About reads
          # THIRD-PARTY-NOTICES.md from exactly here.
          Copy-Item 'LICENSE' (Join-Path $out 'LICENSE.txt')
          Copy-Item 'THIRD-PARTY-NOTICES.md' $out
          Copy-Item 'licenses' (Join-Path $out 'licenses') -Recurse
          # README §13: this marker keeps every byte of state beside the exe, which is
          # what you want from a build you are only trying out.
          '' | Out-File (Join-Path $out 'portable.txt') -Encoding utf8
          Copy-Item 'docs\TESTING_A_BUILD.md' (Join-Path $out 'HOW-TO-TEST.md')
          Compress-Archive -Path $out -DestinationPath 'aurora-tv-portable.zip' -Force

      - name: Upload the portable build
        # Before the installer step, deliberately: bundling has more ways to fail than
        # linking does, and a red installer step should still leave something runnable.
        uses: actions/upload-artifact@v4
        with:
          name: aurora-tv-portable
          path: aurora-tv-portable.zip
          if-no-files-found: error

      - name: Cache the bundler's toolchains
        # Tauri fetches NSIS and WiX on first use and keeps them here; without this
        # they are downloaded again on every run.
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-bundler-tools-${{ runner.os }}

      - name: Build the installers
        # Re-runs cargo, but the release build above is already warm, so this is the
        # bundler's work only. `--config` adds the DLL as a bundled resource without
        # committing a tauri.conf.json that refuses to build wherever it is absent.
        shell: pwsh
        working-directory: src-native/crates/aurora-app
        run: |
          $ErrorActionPreference = 'Stop'
          # An explicit target filename, not a directory: the DLL has to land beside
          # aurora-app.exe, which on Windows is what the resource directory is.
          $name = Split-Path $env:AURORA_MPV_DLL -Leaf
          $cfg = @{
            build  = @{ beforeBuildCommand = '' }
            bundle = @{ resources = @{ "$env:AURORA_MPV_DLL" = $name } }
          } | ConvertTo-Json -Depth 5
          $path = Join-Path $env:RUNNER_TEMP 'bundle.conf.json'
          $cfg | Out-File $path -Encoding utf8
          Get-Content $path

          # Run from the directory holding tauri.conf.json so the CLI finds the app
          # without guessing, and call the shim by its full path: `pnpm exec` resolves
          # against the nearest package, and this directory is not one.
          $bin = Join-Path $env:GITHUB_WORKSPACE 'node_modules\.bin'
          $cli = Get-ChildItem $bin -Filter 'tauri*' |
            Where-Object { $_.Extension -in '.CMD', '.cmd', '.exe' } |
            Select-Object -First 1
          if (-not $cli) {
            Get-ChildItem $bin -Filter 'tauri*' | ForEach-Object { Write-Host $_.FullName }
            throw "No runnable Tauri CLI shim in $bin."
          }
          & $cli.FullName build --config $path
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed with $LASTEXITCODE" }

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: aurora-tv-installers
          path: |
            src-native/target/release/bundle/nsis/*.exe
            src-native/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish this build to its own release
        # Actions artifacts expire; a release does not. Every merge gets its own tag, so
        # a build is never replaced by the one after it and an older installer stays
        # downloadable — which matters the first time something that worked last week
        # stops working. The newest is marked as GitHub's latest release, so
        # /releases/latest remains one link that always points at the current build, and
        # the app's updater has something stable to ask about.
        #
        # The NSIS installer is a single self-contained .exe — it carries libmpv with
        # it, which is why the portable build cannot be one file.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem 'src-native\target\release\bundle\nsis' -Filter '*.exe' |
            Select-Object -First 1
          if (-not $exe) { throw 'No NSIS installer was produced.' }

          $version = $env:AURORA_VERSION
          if (-not $version) { throw 'The version step did not run.' }
          $full = $env:GITHUB_SHA
          $tag  = "v$version"

          # Renamed before upload: the bundler names the file after the version it was
          # built with, but the tag is what people will be matching it against, and
          # several of these have to share a Downloads folder and stay tellable apart.
          $asset = Join-Path $env:RUNNER_TEMP "Aurora-TV-$version-x64-setup.exe"
          Copy-Item $exe.FullName $asset
          $mb = [math]::Round($exe.Length / 1MB)
          Write-Host "Publishing $(Split-Path $asset -Leaf) ($mb MB) as $tag"

          # GitHub writes the changelog itself from the pull requests since the previous
          # release — better than anything assembled here, and it links each one. The
          # previous tag is passed explicitly so the range is the last *release* rather
          # than whatever GitHub infers.
          $previous = git tag --list 'v*' --sort=-v:refname |
            Where-Object { $_ -ne $tag } |
            Select-Object -First 1

          $PSNativeCommandUseErrorActionPreference = $false
          # Not $args: that is a PowerShell automatic variable.
          $noteArgs = @('repos/{owner}/{repo}/releases/generate-notes',
                        '-f', "tag_name=$tag", '--jq', '.body')
          if ($previous) { $noteArgs += @('-f', "previous_tag_name=$previous") }
          $changelog = (gh api @noteArgs) -join "`n"
          if ($LASTEXITCODE -ne 0 -or -not $changelog) {
            # A first release has nothing to diff against, and a rate limit is not a
            # reason to fail a build that already produced an installer.
            Write-Host 'Could not generate notes; falling back to the commit subject.'
            $changelog = "* $(git log -1 --pretty=%s)"
          }
          $PSNativeCommandUseErrorActionPreference = $true

          # Built as an array rather than a here-string: a here-string terminator must
          # sit at column zero, which depends on how YAML strips this block's indent.
          $notes = @(
            $changelog
            ''
            '---'
            ''
            "Built from ``$full`` on $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC."
            ''
            'Every merge publishes its own release and nothing replaces an older one, so'
            'a build you were happy with stays downloadable. Aurora checks this page for'
            'itself and will say in Settings when there is something newer.'
            ''
            'Two downloads: the installer, and a portable zip that needs no install.'
            'Either can update itself from Settings once it is running — the portable'
            'one replaces its own files and restarts, the installed one runs the'
            'installer for you.'
            ''
            'This is a development build, not a finished product. docs/TESTING_A_BUILD.md'
            'says what to look at first and where the log is.'
            ''
            'Built without link-time optimisation to keep CI quick, so do not use it to'
            'benchmark playback performance.'
          ) -join "`n"

          # gh exits non-zero when the release does not exist, which is information
          # rather than an error, so the native-command trap is off around the probe.
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $PSNativeCommandUseErrorActionPreference = $true

          if ($exists) {
            # Only reachable by re-running this same workflow run: a later merge always
            # computes a higher version. So this is a build refreshing its own release,
            # never one build overwriting another.
            gh release edit $tag --notes $notes --latest
          } else {
            gh release create $tag --target $full --latest `
              --title "Aurora TV $version" --notes $notes
          }
          # Both assets, because both are how a copy of Aurora updates itself: an
          # installed one runs the installer, a portable one replaces its own files
          # from the zip. Publishing only the installer is what made a portable build
          # unable to update at all — `Release::asset` refuses to hand it the wrong
          # file, and rightly, so the right one has to be here.
          #
          # Renamed to carry the version, like the installer: several of these share a
          # Downloads folder and have to stay tellable apart. The updater matches on
          # "portable" and ".zip", so the name stays within what it looks for.
          $portableAsset = Join-Path $env:RUNNER_TEMP "aurora-tv-$version-portable.zip"
          Copy-Item 'aurora-tv-portable.zip' $portableAsset

          gh release upload $tag $asset $portableAsset --clobber
          Write-Host "Download: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/$tag"
