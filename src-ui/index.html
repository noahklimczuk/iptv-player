<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora TV</title>
    <!-- Inline, so there is no second request and nothing to 404. The packaged app
         uses the icons in crates/aurora-app/icons; this is for the browser preview. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236c5ce7'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='20' font-weight='800' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root">
      <!-- The window is transparent so the mpv surface can show through it (README
           §2.1), and the app shell paints its own opaque background. Until React has
           rendered there is no shell, so that transparency is a hole straight through
           to the desktop: Aurora launched as a floating title bar over whatever was
           behind it. This is painted by the browser before a line of script runs, and
           React replaces it on its first render.

           Inline, and in literal colours rather than tokens, because the stylesheet
           that defines those tokens is itself a request that has not finished yet. -->
      <div
        id="boot"
        style="position:fixed;inset:0;background:#0b0b0f;display:grid;
               place-items:center;gap:18px;grid-auto-flow:row;
               font-family:'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif"
      >
        <div
          style="width:56px;height:56px;border-radius:13px;display:grid;
                 place-items:center;font-weight:800;font-size:26px;color:#fff;
                 background:linear-gradient(135deg,#6c5ce7,#00cec9)"
        >A</div>
        <div style="color:#6b6b78;font-size:13px;letter-spacing:.02em">Starting Aurora…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
