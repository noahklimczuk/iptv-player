[package]
name = "aurora-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aurora TV — Windows IPTV player"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aurora-core.workspace = true
aurora-db.workspace = true
aurora-ingest.workspace = true
