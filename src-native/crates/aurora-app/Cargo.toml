[package]
name = "aurora-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aurora TV — Windows IPTV player"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aurora-core.workspace = true
aurora-db.workspace = true
aurora-ingest.workspace = true
aurora-sync.workspace = true
aurora-video.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
time.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2", features = ["protocol-asset"] }
parking_lot = "0.12"
# The seek preview's pictures, as PNG data URLs. Both already in the lockfile.
png = "0.17"
base64 = "0.22"

# ShellExecuteW, to open the releases page in the viewer's browser. Same version the
# player crate already pulls in, so this adds one feature rather than a dependency.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_RestartManager", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[features]
# Tauri decides dev-versus-production by this feature, not by the cargo profile:
# `tauri::is_dev()` is `!cfg!(feature = "custom-protocol")`. With it absent from the
# default set, `cargo build --release` produces a binary that loads `devUrl` — a
# shipped app pointing at a dev server that is not running. That is exactly what the
# first portable build did. It belongs in `default` so the safe thing is what a plain
# build gives you; `tauri dev` turns it off with --no-default-features to get hot
# reload back (docs/BUILDING.md).
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
