[package]
name = "aurora-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aurora TV — Windows IPTV player"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aurora-core.workspace = true
aurora-db.workspace = true
aurora-ingest.workspace = true
aurora-player.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
time.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2", features = [] }
parking_lot = "0.12"

[features]
# Tauri decides dev-versus-production by this feature, not by the cargo profile:
# `tauri::is_dev()` is `!cfg!(feature = "custom-protocol")`. With it absent from the
# default set, `cargo build --release` produces a binary that loads `devUrl` — a
# shipped app pointing at a dev server that is not running. That is exactly what the
# first portable build did. It belongs in `default` so the safe thing is what a plain
# build gives you; `tauri dev` turns it off with --no-default-features to get hot
# reload back (docs/BUILDING.md).
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
