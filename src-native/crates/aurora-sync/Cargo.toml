[package]
name = "aurora-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-device sync: merge rules, the push/pull engine and its transports"

# No Tauri and no platform code: this crate is shared by the Windows host and the Apple
# apps (docs/APPLE_PORT_AND_SYNC.md §3.1), and its tests are multi-device simulations
# that run on any host.
[dependencies]
aurora-core.workspace = true
aurora-db.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# End-to-end encryption (§3.5). argon2, sha2 and getrandom are already in the tree for
# PINs and the artwork cache.
argon2.workspace = true
getrandom.workspace = true
sha2.workspace = true
hmac = "0.12"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# Firebase over REST (§3.1): the same blocking rustls client aurora-ingest uses, so
# one TLS stack and nothing new for the tvOS build to get through (§5 risk 1).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
base64 = "0.22"
