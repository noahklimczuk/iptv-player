[package]
name = "aurora-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fetching and importing provider content into the Aurora library"

[dependencies]
aurora-core.workspace = true
aurora-db.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
# Blocking on purpose: ingestion is a background job, and rusqlite is synchronous.
# An async client here would buy nothing but a Send/Sync fight across await points.
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls",
  "gzip",
] }
# Only for `block_in_place`. `reqwest::blocking` parks whatever thread calls it, and
# when that thread is one of Tauri's async workers the runtime has to be told so it can
# put a replacement on the queue. Already in the tree via reqwest, so this costs
# nothing to build.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread"] }
# reqwest's gzip feature only covers Content-Encoding. Providers also serve plain
# `.xml.gz` *files*, which have to be inflated by hand.
flate2 = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Windows Credential Manager (README C10). Gated to Windows deliberately: on Linux
# the same crate wants a D-Bus Secret Service, which a headless CI runner has no
# business requiring just to run the parser tests.
#
# `windows-native` is not optional despite reading like it. keyring 3 makes every
# platform store an opt-in feature and falls back to `mock` without one — and the mock
# builds a *fresh, empty* credential per `Entry`, so a password written through one
# and read through another is simply gone. That is not a store, and with it Aurora
# saved no provider password on Windows at all.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
