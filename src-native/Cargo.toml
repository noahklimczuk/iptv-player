[workspace]
resolver = "2"
members = [
  "crates/aurora-core",
  "crates/aurora-db",
  "crates/aurora-player",
  "crates/aurora-ingest",
  "crates/aurora-app",
]
# aurora-app pulls in Tauri, whose Linux backend needs GTK and whose Windows build
# needs the MSVC toolchain. Excluding it from the default set keeps a bare
# `cargo test` working on any host; CI builds it explicitly on windows-latest.
default-members = [
  "crates/aurora-core",
  "crates/aurora-db",
  "crates/aurora-player",
  "crates/aurora-ingest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
time = { version = "0.3", features = ["parsing", "formatting", "macros", "local-offset"] }
quick-xml = "0.42"
regex = "1"
argon2 = "0.5"
getrandom = "0.3"
# Content-addressing for the artwork cache. Already in the tree via rustls, so this
# costs nothing to build.
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
aurora-core = { path = "crates/aurora-core" }
aurora-db = { path = "crates/aurora-db" }
aurora-player = { path = "crates/aurora-player" }
aurora-ingest = { path = "crates/aurora-ingest" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
