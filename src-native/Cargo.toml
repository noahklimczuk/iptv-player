[workspace]
resolver = "2"
members = [
  "crates/aurora-core",
  "crates/aurora-db",
  "crates/aurora-player",
  "crates/aurora-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
time = { version = "0.3", features = ["parsing", "formatting", "macros", "local-offset"] }
quick-xml = "0.36"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
aurora-core = { path = "crates/aurora-core" }
aurora-db = { path = "crates/aurora-db" }
aurora-player = { path = "crates/aurora-player" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
