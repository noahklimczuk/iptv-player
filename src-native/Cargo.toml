[workspace]
resolver = "2"
members = [
  "crates/aurora-core",
  "crates/aurora-db",
  "crates/aurora-player",
  "crates/aurora-ingest",
  "crates/aurora-app",
]
# aurora-app pulls in Tauri, whose Linux backend needs GTK and whose Windows build
# needs the MSVC toolchain. Excluding it from the default set keeps a bare
# `cargo test` working on any host; CI builds it explicitly on windows-latest.
default-members = [
  "crates/aurora-core",
  "crates/aurora-db",
  "crates/aurora-player",
  "crates/aurora-ingest",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
time = { version = "0.3", features = ["parsing", "formatting", "macros", "local-offset"] }
quick-xml = "0.42"
regex = "1"
argon2 = "0.5"
getrandom = "0.3"
# Content-addressing for the artwork cache. Already in the tree via rustls, so this
# costs nothing to build.
sha2 = "0.10"
# `functions` registers `shown_title`, so the letter bar, the A-Z sort and what the
# viewer reads are one expression rather than three that disagree (R-52).
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }
aurora-core = { path = "crates/aurora-core" }
aurora-db = { path = "crates/aurora-db" }
aurora-player = { path = "crates/aurora-player" }
aurora-ingest = { path = "crates/aurora-ingest" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# No `panic = "abort"`, deliberately.
#
# `supervise.rs` is built on `catch_unwind` and exists so that one panicking tick does
# not end a background thread for the rest of the session -- its header is explicit that
# the alternative is "an OSD frozen on whatever it last showed, failover that stopped
# working, or ... a DVR that silently never records anything again". Under `abort`,
# `catch_unwind` cannot catch anything: the process is gone before it returns. So the
# safety net existed in every debug build and in none of the shipped ones, across all six
# `supervised` call sites -- maintenance, player, mosaic, DVR, update, playlist refresh
# (R-72).
#
# It also reframed every other panic in the codebase: a bad rule on a Turkish title
# (R-17) and a pasted URL with a multi-byte character after a `%` (R-63) were caught and
# logged in a debug build and fatal in a release one, which is the opposite way round
# from what a reader of `supervise.rs` would assume. And `cargo test` builds with the test
# profile, which unwinds, so the test named `a_panicking_tick_does_not_end_the_loop` could
# only ever pass and could never exercise the configuration that ships.
#
# The trade is unwinding tables -- some binary size and a little speed -- against six
# background threads whose panics are currently fatal. `tests/contract.rs` asserts this
# stays gone.
